<article class="card{% if include.book.image %} has-cover{% endif %}">
  {% if include.book.image %}
  <div class="cover">
    <img src="{{ include.book.image | relative_url }}"
         alt="Illustration for {{ include.book.title }}" loading="lazy">
  </div>
  {% endif %}
  <div class="card-body">
    <h3>{{ include.book.title }}</h3>
    {% if include.book.note %}<p>{{ include.book.note }}</p>{% endif %}
    {% if include.book.finished %}<div class="when">{{ include.book.finished }}</div>{% endif %}
    {% if include.book.author %}<div class="meta"><span class="pill">{{ include.book.author }}</span></div>{% endif %}
  </div>
</article>
