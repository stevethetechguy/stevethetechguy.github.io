---
layout: default
---
<article class="essay">
  <header class="ph">
    <a class="back" href="{{ '/essays/' | relative_url }}">All essays</a>
    <h1>{{ page.title }}</h1>
    <p class="ph-b">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.tags.size > 0 %}{% for t in page.tags %}<span class="pill">{{ t }}</span>{% endfor %}{% endif %}
    </p>
  </header>
  <div class="prose">{{ content }}</div>
</article>
